<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#F5EFE6"/>
  <!-- Stem -->
  <rect x="15" y="13" width="2.5" height="13" rx="1.25" fill="#2A1F10" transform="rotate(-3 15 13)"/>
  <!-- Left leaf (mint) -->
  <ellipse cx="11" cy="11" rx="5.5" ry="3.5" fill="#A8D5B5" stroke="#2A1F10" stroke-width="1.5" transform="rotate(15 11 11)"/>
  <!-- Right leaf (coral) -->
  <ellipse cx="20" cy="8" rx="5" ry="3" fill="#D4785A" stroke="#2A1F10" stroke-width="1.5" transform="rotate(-18 20 8)"/>
</svg>
